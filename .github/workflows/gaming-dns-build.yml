name: Gaming DNS Android Build v5

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaming-dns-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter 3.38.10
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Print toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version

      - name: Generate a clean Android scaffold
        shell: bash
        run: |
          set -euo pipefail
          SCAFFOLD="${RUNNER_TEMP}/gaming-dns-scaffold-${GITHUB_RUN_ID}"
          rm -rf "$SCAFFOLD"
          flutter create --platforms=android --org com.example --project-name gaming_dns "$SCAFFOLD" 2>&1 | tee flutter-create.log
          if [[ ! -d "$SCAFFOLD/android" ]]; then
            echo "ERROR: Flutter did not create $SCAFFOLD/android" >&2
            find "$SCAFFOLD" -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "Generated Android Gradle files:"
          find "$SCAFFOLD/android" -maxdepth 4 -type f \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'gradlew' -o -name 'gradle-wrapper.properties' \) -print
          rm -rf android
          cp -a "$SCAFFOLD/android" android
          mkdir -p android/app/src/main/kotlin/com/example/gaming_dns
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values
          cp android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_custom/kotlin/com/example/gaming_dns/MainActivity.kt android/app/src/main/kotlin/com/example/gaming_dns/MainActivity.kt
          cp android_custom/kotlin/com/example/gaming_dns/GamingVpnService.kt android/app/src/main/kotlin/com/example/gaming_dns/GamingVpnService.kt
          cp android_custom/res/drawable/ic_launcher.xml android/app/src/main/res/drawable/ic_launcher.xml
          cp android_custom/res/values/styles.xml android/app/src/main/res/values/styles.xml
          cp android_custom/res/values/colors.xml android/app/src/main/res/values/colors.xml
          chmod +x android/gradlew
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          find android -maxdepth 2 -type f -name 'settings.gradle*' -print -quit | grep -q .

      - name: Prepare compatible Android Gradle versions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_android_gradle.py "$GITHUB_WORKSPACE/android" 2>&1 | tee gradle-prepare.log

      - name: Resolve Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee flutter-pub-get.log

      - name: Test IPv4 and IPv6 conversion
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/ip_converter_test.dart 2>&1 | tee flutter-test.log

      - name: Analyze Dart source (diagnostic)
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee flutter-analyze.log

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub --verbose 2>&1 | tee build-release.log
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-DNS-Build-Logs-v5
          path: |
            flutter-create.log
            gradle-prepare.log
            flutter-pub-get.log
            flutter-test.log
            flutter-analyze.log
            build-release.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-DNS-Release-APK-v5
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
